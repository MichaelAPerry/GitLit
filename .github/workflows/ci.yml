name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      # Real-browser coverage for the one signal jsdom cannot produce:
      # isTrusted on genuine input (§7.5.1).
      - run: pnpm --filter @gitlit/web exec playwright install --with-deps chromium
      - run: pnpm --filter @gitlit/web test:e2e
