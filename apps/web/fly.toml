# fly deploy -c apps/web/fly.toml
#
# Next.js in standalone mode. Stateless, and the only service an author's
# browser talks to directly besides the API.

app = "gitlit-web"
primary_region = "iad"

[build]
  dockerfile = "../../Dockerfile"
  build-target = "web"
  # Next.js inlines NEXT_PUBLIC_* into the client bundle at BUILD time. Setting
  # it as a secret or in [env] does nothing: the browser would keep calling
  # localhost. It has to be here.
  [build.args]
    NEXT_PUBLIC_API_URL = "https://api.gitlit.app"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
