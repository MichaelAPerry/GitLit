services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gitlit
      POSTGRES_PASSWORD: gitlit
      POSTGRES_DB: gitlit
    ports: ["5432:5432"]
    volumes: ["gitlit_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitlit"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  gitlit_pg:
